<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mes Comptes</title>
<style>
:root{--sep:#d6d1c4;--th-bg:#d6e4dc;--th-fg:#24493f;--zebra:#f6f4ef;--hover:#eeebe3;--side:#fbfaf7;--tot:#f3f1ec;--sol:#fbfaf7;--bg:#f5f3ee;--panel:#fff;--ink:#1f2328;--muted:#6b6f76;--line:#e3dfd5;--accent:#2f5d50;--accent-soft:#e7efea;--warn:#b5562a;--warn-soft:#fbede4;--danger:#a83232;--pos:#1d7a46;--neg:#b23b3b;--radius:10px;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04)}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--side);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{font-weight:700;font-size:19px;padding:0 10px 14px}.logo span{color:var(--accent)}
.nav button{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;padding:7px 10px;border-radius:8px;cursor:pointer;text-align:left}
.nav button:hover{background:#f0ede6}.nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .n{margin-left:auto;font-size:12px;color:var(--warn);font-weight:600}
.nav-title{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:14px 10px 6px}
.side-foot{margin-top:16px;padding:10px;border-top:1px solid var(--line);display:grid;gap:6px}
.side-foot button,.side-foot a{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px;cursor:pointer;font-size:13px;text-align:center;text-decoration:none;color:var(--ink)}
.side-foot button:hover,.side-foot a:hover{border-color:var(--accent)}
.who{font-size:12.5px;color:var(--muted);text-align:center}
main{padding:20px 26px 60px;min-width:0}
.top{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.top h1{font-size:22px;margin:0 auto 0 0}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 13px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.dan{color:var(--danger)}.btn.sm{padding:3px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
select.f,input.f{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 9px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px;box-shadow:var(--shadow)}
.card .k{font-size:12.5px;color:var(--muted)}.card .v{font-size:22px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.card .s{font-size:12px;color:var(--muted)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:15px;box-shadow:var(--shadow);min-width:0;margin-bottom:16px}
.box h2{font-size:15px;margin:0 0 12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tw{overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--th-fg);background:var(--th-bg);font-weight:700;position:sticky;top:0;z-index:1;white-space:nowrap}
tbody tr:hover{background:#faf8f3}
th,td{border-right:1px solid var(--line)}
tbody tr:nth-child(even):not(.sec):not(.tot):not(.sol)>td{background:var(--zebra)}
tbody tr:hover:not(.sec):not(.tot):not(.sol)>td{background:var(--hover)}
.rel tbody tr:nth-child(even):not(.s)>td{background:#f4f4f4!important}
td.ln,th.ln{width:1%;text-align:right;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap;padding-right:8px}
table.nl tbody{counter-reset:ln}table.nl tbody tr{counter-increment:ln}table.nl td.ln::before{content:counter(ln)}th:last-child,td:last-child{border-right:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.muted{color:var(--muted)}
.clic{cursor:pointer}.clic:hover{text-decoration:underline}
table.recap td,table.recap th{padding:5px 8px;font-size:12.5px;border-right:1px solid var(--line)}
table.recap td:last-child,table.recap th:last-child{border-right:0}
table.recap td:first-child,table.recap th:first-child{border-right:2px solid var(--sep)}
table.recap td:first-child,table.recap th:first-child{position:sticky;left:0;background:var(--panel);z-index:2;white-space:nowrap}
table.recap th:first-child{background:var(--th-bg);z-index:3}
table.recap tr.tot td{font-weight:700;background:var(--tot)}
table.recap tr.sec td{background:var(--th-bg);color:var(--th-fg);letter-spacing:.04em;font-weight:700;font-size:12px;text-transform:uppercase}
table.recap tr.sec td:last-child{border-right:0}
table.recap tbody tr.sec td{border-top:5px solid var(--bg)}
table.recap tr.tot>td,table.recap tr.sol:has(+tr.sec)>td{box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--th-fg) 55%,transparent)}
.tw:has(>table.recap){border:0;box-shadow:none;background:transparent;border-radius:0}
table.recap td{background:var(--panel)}
table.recap tr>:first-child{border-left:1px solid var(--line)}
table.recap tr>:last-child{border-right:1px solid var(--line)!important}
table.recap thead th{border-top:1px solid var(--line)}
table.recap tbody tr:last-child td{border-bottom:1px solid var(--line)}
table.recap tbody tr.sec>td:first-child{border-left-color:var(--bg)}
table.recap tbody tr.sec>td:last-child{border-right-color:var(--bg)!important}
table.recap tbody tr.sec:first-child td{border-top:0}
table.recap .dop{font-size:11.5px;color:var(--accent);font-weight:600}
table.recap tr.sol td{background:var(--sol);color:var(--muted)}
td input.in,td select.in{border:1px solid transparent;background:transparent;border-radius:6px;padding:3px 5px;width:100%;font-size:13px}
td input.in:hover,td select.in:hover{border-color:var(--line)}
td input.in:focus,td select.in:focus{border-color:var(--accent);background:#fff;outline:none}
td input.in.num{text-align:right}
select.rub.vide{background:var(--warn-soft);border-color:#efc9b3}
.rubbtn{width:100%;display:flex;justify-content:space-between;align-items:center;gap:6px;text-align:left;border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 7px;cursor:pointer;font-size:13px;min-height:28px}
.rubbtn:hover{border-color:var(--line);background:#fff}.rubbtn::after{content:'▾';color:var(--muted);font-size:11px}
.rubbtn.vide{background:var(--warn-soft);border-color:#efc9b3;color:var(--warn)}
#rubPick{position:fixed;z-index:45;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);width:300px;max-height:360px;display:flex;flex-direction:column;overflow:hidden}
#rubPick input{border:0;border-bottom:1px solid var(--line);padding:10px 12px;font-size:14px;outline:none}
#rubPick ul{list-style:none;margin:0;padding:4px 0;overflow:auto}
#rubPick li{padding:6px 12px;cursor:pointer;font-size:13.5px}#rubPick li.g{cursor:default;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:8px 12px 3px}
#rubPick li.on{background:var(--accent-soft);color:var(--accent)}#rubPick li.cur{font-weight:700}#rubPick li.vide{color:var(--warn)}
#rubPick mark{background:#ffe9a8;color:inherit;padding:0}#rubPick .rien{padding:10px 12px;color:var(--muted);font-size:13px}
.badge{font-size:12px;padding:2px 8px;border-radius:20px;white-space:nowrap;display:inline-block}
.b-ok{background:var(--accent-soft);color:var(--accent)}.b-err{background:#f8e1e1;color:var(--danger)}.b-warn{background:var(--warn-soft);color:var(--warn)}.b-grey{background:#eee;color:var(--muted)}
.empty{text-align:center;padding:40px 20px;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:var(--radius)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
.bars{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:10px}
.bars .m{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;height:100%;justify-content:flex-end;cursor:pointer}
.bars .pair{display:flex;gap:2px;align-items:flex-end;height:100%}
.bars i{display:block;width:9px;border-radius:3px 3px 0 0}
.bars .l{font-size:10.5px;color:var(--muted)}
.leg{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:6px}.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
.ov{position:fixed;inset:0;background:rgba(25,25,20,.42);display:none;align-items:flex-start;justify-content:center;padding:4vh 16px;z-index:20;overflow:auto}
.ov.on{display:flex}
.modal{background:#fff;border-radius:14px;width:min(640px,100%);box-shadow:0 20px 60px rgba(0,0,0,.25)}
.mh{display:flex;align-items:center;gap:10px;padding:15px 20px;border-bottom:1px solid var(--line)}.mh h3{margin:0 auto 0 0;font-size:17px}
.mb{padding:16px 20px}.mf{display:flex;gap:8px;justify-content:flex-end;padding:13px 20px;border-top:1px solid var(--line);align-items:center}
.x{border:0;background:none;font-size:22px;cursor:pointer;color:var(--muted)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:11px 14px}
.form label{display:grid;gap:4px;font-size:13px;color:var(--muted)}.form label.full{grid-column:1/-1}
.form input,.form select,.form textarea{border:1px solid var(--line);border-radius:8px;padding:7px 9px;color:var(--ink);background:#fff;width:100%}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1f2328;color:#fff;padding:10px 18px;border-radius:8px;font-size:14px;opacity:0;transition:.25s;z-index:70;display:flex;gap:12px;align-items:center}
.toast.on{opacity:1}.toast button{background:#fff;color:#1f2328;border:0;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:13px}
.prog{height:6px;background:#eee9df;border-radius:4px;overflow:hidden;margin:10px 0}.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.drop{border:2px dashed var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--muted);cursor:pointer;background:#fff}
.drop.hot{border-color:var(--accent);background:var(--accent-soft)}
.rubcols{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.rubcols li{display:flex;gap:6px;align-items:center;padding:3px 0}
.rubcols ul{list-style:none;margin:0;padding:0}
.rubcols li input{flex:1;border:1px solid transparent;border-radius:6px;padding:3px 6px}
.rubcols li input:hover{border-color:var(--line)}
.rubcols li .c{font-size:11.5px;color:var(--muted);min-width:34px;text-align:right}
.ib{border:0;background:none;cursor:pointer;color:var(--muted);padding:2px 5px;border-radius:5px}.ib:hover{background:#f0ede6;color:var(--ink)}
.menu-btn{display:none}
/* verrou */
.lock{position:fixed;inset:0;background:var(--bg);z-index:60;display:none;align-items:center;justify-content:center;padding:20px}
.lock.on{display:flex}.lockbox{text-align:center;width:min(320px,100%)}.lockbox .logo{font-size:24px;padding:0 0 6px}
.lockbox p{margin:6px 0 18px;color:var(--muted);min-height:2.6em}.lockbox p.err{color:var(--danger)}
.dots{display:flex;gap:12px;justify-content:center;margin-bottom:26px}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent);display:block}.dots i.f{background:var(--accent)}
.dots.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px;justify-content:center}
.pad button{width:72px;height:72px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:24px;cursor:pointer;color:var(--ink)}
.pad button.ghost{border:0;background:none;font-size:20px}.lockbox a{display:inline-block;margin-top:22px;font-size:13.5px;color:var(--muted)}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;left:0;top:0;z-index:15;width:240px;transform:translateX(-100%);transition:.2s;box-shadow:0 0 40px rgba(0,0,0,.2)}
  aside.open{transform:none}.menu-btn{display:inline-block}main{padding:14px}
  .grid2,.form,.rubcols{grid-template-columns:1fr}.hide-m{display:none!important}
  table.opst thead{display:none}
  table.opst tr{display:grid;grid-template-columns:1fr auto;gap:3px 10px;padding:9px 12px;border-bottom:1px solid var(--line)}
  table.opst td{border:0;padding:0}
  table.opst td.d{font-size:12.5px;color:var(--muted)}
  table.opst td.mt{grid-column:2;grid-row:1;font-weight:600}
  table.opst td.lib,table.opst td.rb{grid-column:1/-1}
  table.opst td.rb select{border:1px solid var(--line);padding:5px}
}
/* thèmes */
body[data-theme=bleu]{--accent:#2b5c8a;--accent-soft:#e3edf6;--th-bg:#d3e2f0;--th-fg:#1d4269;--bg:#f2f5f8;--side:#f7f9fb;--zebra:#f2f5f9;--hover:#e6edf4;--tot:#e9eff5;--sol:#f5f8fb;--line:#d9e1e9}
body[data-theme=bordeaux]{--accent:#7b2f3f;--accent-soft:#f4e6e9;--th-bg:#ecd5da;--th-fg:#5a1f2c;--bg:#f7f2f1;--side:#fbf7f6;--zebra:#f8f1f0;--hover:#f0e4e4;--tot:#f2e8e7;--sol:#faf5f4;--line:#e8dadb}
body[data-theme=ardoise]{--accent:#3f4b59;--accent-soft:#e6e9ed;--th-bg:#d8dde3;--th-fg:#2a333d;--bg:#f2f3f5;--side:#f7f8f9;--zebra:#f3f4f6;--hover:#e8eaee;--tot:#eceef1;--sol:#f6f7f8;--line:#dcdfe4}
body[data-theme=sombre]{color-scheme:dark;--bg:#16181b;--panel:#1f2226;--ink:#e6e6e6;--muted:#9aa0a6;--line:#33373d;--accent:#6fbf9d;--accent-soft:#233b32;--warn:#e39a6f;--warn-soft:#3a2a20;--danger:#ef7d7d;--pos:#6fcf97;--neg:#f08b8b;
  --sep:#4a5058;--th-bg:#26352f;--th-fg:#bfe3d2;--side:#1b1d21;--zebra:#23272c;--hover:#2b3036;--tot:#2a2e33;--sol:#202327}
body[data-theme=sombre] .btn,body[data-theme=sombre] select.f,body[data-theme=sombre] input.f,body[data-theme=sombre] .modal,body[data-theme=sombre] .drop,body[data-theme=sombre] #rubPick,
body[data-theme=sombre] .side-foot button,body[data-theme=sombre] .side-foot a,body[data-theme=sombre] .form input,body[data-theme=sombre] .form select,body[data-theme=sombre] .form textarea,body[data-theme=sombre] .pad button,
body[data-theme=sombre] td input.in:focus,body[data-theme=sombre] td select.in:focus,body[data-theme=sombre] .rubbtn:hover{background:var(--panel);color:var(--ink);border-color:var(--line)}
body[data-theme=sombre] .btn.pri{background:var(--accent);color:#10231b;border-color:var(--accent)}
body[data-theme=sombre] .badge.b-grey{background:#2c3035;color:var(--muted)}body[data-theme=sombre] .b-err{background:#3d2424}
body[data-theme=sombre] #rubPick mark{background:#6b5a1f}
.themes{display:flex;gap:10px;flex-wrap:wrap}
.themes button{display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:14px}
.themes button.on{border-color:var(--accent);font-weight:700}
.themes i{display:inline-block;width:22px;height:22px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
@media print{body{--th-bg:#eee;--th-fg:#000}}
#printZone{display:none}
.rel{font:11px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#000}
.rel h1{font-size:17px;margin:0}.rel .hd{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:8px}
.rel .meta{text-align:right;font-size:11px}
.rel table{width:100%;border-collapse:collapse;margin-bottom:6px}
.rel th,.rel td{border:1px solid #999;padding:3px 5px;font-size:10.5px;position:static;background:none;color:#000}
.rel th{background:#eee!important;text-transform:none;letter-spacing:0;font-size:10.5px}
.rel td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.rel tr.s td{background:#f4f4f4;font-weight:600}
.rel .sec{page-break-after:always}.rel .sec:last-child{page-break-after:auto}
.rel .pied{font-size:9.5px;color:#555;margin-top:4px}
@media print{body.printing .app,body.printing .ov,body.printing .toast,body.printing .lock{display:none!important}body.printing #printZone{display:block}@page{margin:12mm}}
@media print{aside,.top .btn,.top select,.filters,.noprint{display:none!important}.app{display:block}main{padding:0}.tw,.box{box-shadow:none;border:0}th{position:static}}
input.num,.in.num{text-align:right}
tbody tr.dblc>td{background:#fbe1dc!important}
body[data-theme=sombre] tbody tr.dblc>td{background:#4a2a26!important}
</style>
</head>
<body>
<script>try{document.body.dataset.theme=localStorage.getItem("mc-theme")||""}catch(e){}</script>
<div class="app">
  <aside id="side">
    <div class="logo">Mes <span>Comptes</span></div>
    <select id="dosSel" class="f" style="width:100%;margin:0 0 10px;font-weight:600"></select>
    <div class="nav" id="nav">
      <button data-v="dash">🏠 Tableau de bord</button>
      <button data-v="ops">📒 Opérations<span class="n" id="nClasser"></span></button>
      <button data-v="import">📥 Importer un relevé</button>
      <div class="nav-title">Synthèses</div>
      <button data-v="recap">📅 Récap mensuel</button>
      <button data-v="annuel">📊 Récap annuel & budget</button>
      <button data-v="epargne">🏦 Épargne</button>
      <div class="sci-only" style="display:none"><div class="nav-title">SCI</div>
      <button data-v="biens">🏢 Biens & loyers</button>
      <button data-v="quittances">🧾 Quittances</button>
      <button data-v="d2072">📑 Déclaration 2072</button></div>
      <div class="nav-title">Gestion</div>
      <button data-v="cheques">✍️ Chèques</button>
      <button data-v="regles">🔀 Règles de classement</button>
      <button data-v="rubriques">🏷️ Rubriques</button>
      <button data-v="reglages">⚙️ Comptes & réglages</button>
    </div>
    <div class="side-foot">
      <div class="who" id="who"></div>
      <a href="index.html">📄 Mes Papiers</a>
      <button id="bLock" style="display:none">🔒 Verrouiller</button>
    </div>
  </aside>
  <main>
    <div class="top">
      <button class="btn menu-btn" id="bMenu">☰</button>
      <h1 id="title">Mes Comptes</h1>
      <div id="tools" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"></div>
    </div>
    <div id="view"><div class="empty">Chargement…</div></div>
  </main>
</div>

<!-- Fiche opération -->
<div class="ov" id="ovOp">
  <div class="modal">
    <div class="mh"><h3 id="opTitle">Opération</h3><button class="x" data-close>×</button></div>
    <div class="mb"><form class="form" id="opForm" autocomplete="off">
      <label>Compte<select name="compte" id="opCompte"></select></label>
      <label>Date<input name="date" type="date" required></label>
      <label class="full">Libellé<input name="libelle" required></label>
      <label>Montant (€, négatif = dépense)<input name="montant" type="number" step="0.01" required></label>
      <label>Rubrique<select name="rubrique" id="opRub"></select></label>
      <label class="full">Note<input name="note"></label>
      <label class="full">Justificatif (Mes Papiers)<select name="doc_id" id="opDoc"><option value="">— aucun —</option></select></label>
      <div class="full" id="opDocLink" style="font-size:13px"></div>
    </form></div>
    <div class="mf"><button class="btn dan" id="opDel" style="margin-right:auto">Supprimer</button><button class="btn" data-close>Annuler</button><button class="btn pri" id="opSave">Enregistrer</button></div>
  </div>
</div>

<!-- Verrouillage -->
<div class="lock" id="lock"><div class="lockbox">

const CRYPTO_OK=!!(window.crypto&&crypto.subtle&&window.isSecureContext);
const tenc=new TextEncoder(),tdec=new TextDecoder();

let PINKEY=null;
const pinRec=()=>{try{return JSON.parse(localStorage.getItem('mp-pin')||'null')}catch(e){return null}};

// le code reste ouvert 5 minutes quand on passe de Mes Papiers à Mes Comptes (même onglet)
let noKeep=false;
function relock(){noKeep=true;try{sessionStorage.removeItem('mp-pin-sess')}catch(e){}location.reload()}

async function resumeSession(){try{const s=JSON.parse(sessionStorage.getItem('mp-pin-sess')||'null');if(!s||Date.now()-s.t>5*60000)return false;const k=await rawKey(ub64(s.k));if(await decStr(k,pinRec().check)!=='mes-papiers-ok')return false;PINKEY=k;keepSession();return true}catch(e){return false}}

const weakPin=p=>/^(\d)\1+$/.test(p)||'0123456789012345678'.includes(p)||'9876543210987654321'.includes(p)||/^(\d\d)\1+$/.test(p)||/^(\d{4})\1$/.test(p);

async function lockKey(k){
  const s=lockState;if(!s||s.busy)return;
  if(k==='back'){s.code=s.code.slice(0,-1);lockDots(s.code.length);return}
  if(!/^\d$/.test(k)||s.code.length>=8)return;
  s.code+=k;lockDots(s.code.length);if(s.code.length<8)return;
  const code=s.code;s.code='';
  if(s.mode==='unlock'){
    const wait=+LS.get('mp-pin-wait','0');
    if(Date.now()<wait){lockMsg(`Trop d'erreurs : attends ${Math.ceil((wait-Date.now())/1000)} s`,true);lockDots(0,true);return}
    s.busy=true;lockMsg('Vérification…');const r=pinRec();let ok=false,key=null;
    try{key=await pinKey(code,ub64(r.salt));ok=(await decStr(key,r.check))==='mes-papiers-ok'}catch(e){}
    s.busy=false;
    if(ok){LS.set('mp-pin-fails','0');PINKEY=key;keepSession();$('#lock').classList.remove('on');lockState=null;s.res(true);return}
    const fails=+LS.get('mp-pin-fails','0')+1;LS.set('mp-pin-fails',String(fails));
    if(fails>=10){wipeLogin();LS.set('mp-pin-fails','0');lockMsg('10 erreurs : connexion effacée. Reconnecte-toi.',true);setTimeout(()=>location.reload(),2500);return}
    if(fails>=5)LS.set('mp-pin-wait',String(Date.now()+30000));
    lockMsg(`Code incorrect (${10-fails} essai${10-fails>1?'s':''} restant${10-fails>1?'s':''})`,true);lockDots(0,true);
  }else if(!s.first){
    if(weakPin(code)){lockMsg('Code trop simple, choisis-en un autre',true);lockDots(0,true);return}
    s.first=code;lockMsg('Tape-le une deuxième fois pour confirmer');lockDots(0);
  }else{
    if(code!==s.first){s.first='';lockMsg('Les deux codes ne correspondent pas. Recommence.',true);lockDots(0,true);return}
    s.busy=true;lockMsg('Enregistrement…');
    const salt=crypto.getRandomValues(new Uint8Array(16)),key=await pinKey(code,salt);
    const old={};try{Object.keys(localStorage).filter(k=>/^mp-sb-auth/.test(k)).forEach(k=>old[k]=localStorage.getItem(k))}catch(e){}
    LS.set('mp-pin',JSON.stringify({salt:b64(salt),check:await encStr(key,'mes-papiers-ok')}));PINKEY=key;keepSession();
    for(const [k,v] of Object.entries(old))await secureStore.setItem(k,v);
    s.busy=false;$('#lock').classList.remove('on');lockState=null;toast('Code enregistré');s.res(true);
  }
}

const D={comptes:[],ops:[],rubs:[],regles:[],epargne:[],cheques:[],biens:[],annexes:[]};

  dataVer++;

  D.rubs.sort((a,b)=>a.ordre-b.ordre||a.nom.localeCompare(b.nom));

  const n=D.ops.filter(aClasser).length;$('#nClasser').textContent=n||'';

/* sélecteur de rubrique avec recherche */
function pickRub(anchor,current,onPick,montant){
  closePick();
  const box=document.createElement('div');box.id='rubPick';
  box.innerHTML=`<input placeholder="Tape une lettre ou un mot…" autocomplete="off"><ul style="position:relative"></ul>`;
  document.body.appendChild(box);
  const r=anchor.getBoundingClientRect(),h=360,below=window.innerHeight-r.bottom>h||r.top<h;
  box.style.left=Math.max(8,Math.min(r.left,window.innerWidth-308))+'px';
  if(below)box.style.top=(r.bottom+4)+'px';else box.style.bottom=(window.innerHeight-r.top+4)+'px';
  const inp=box.querySelector('input'),ul=box.querySelector('ul');let items=[],on=0,tout=!montant;
  const GR=[['depense','Dépenses'],['recette','Recettes'],['ignore','Ignorées (virements internes)']];
  const hl=(t,q)=>{if(!q)return esc(t);const i=norm(t).indexOf(q);return i<0?esc(t):esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+q.length))+'</mark>'+esc(t.slice(i+q.length))};
  function draw(){
    const q=norm(inp.value);items=[];let html='';
    if(!q){items.push('');html+=`<li class="vide" data-k="0">— à classer —</li>`}
    const sens=montant>0?'recette':'depense',cach=tout?0:D.rubs.filter(x=>x.type!==sens&&x.type!=='ignore'&&(!q||norm(x.nom).includes(q))).length;
    for(const [t,lab] of GR){
      if(!tout&&t!==sens&&t!=='ignore')continue;
      let l=D.rubs.filter(x=>x.type===t&&(!q||norm(x.nom).includes(q)));
      if(q)l=l.slice().sort((a,b)=>(norm(b.nom).startsWith(q)-norm(a.nom).startsWith(q)));
      if(!l.length)continue;html+=`<li class="g">${lab}</li>`;
      l.forEach(x=>{html+=`<li data-k="${items.length}" class="${norm(x.nom)===norm(current)?'cur':''}">${hl(x.nom,q)}</li>`;items.push(x.nom)});
    }
    if(!html)html='<div class="rien">Aucune rubrique ne contient « '+esc(inp.value)+' »</div>';
    if(cach)html+=`<div class="rien" style="border-top:1px solid var(--line)"><a href="#" id="pkAll">Voir toutes les rubriques</a> <span>(${cach} ${montant>0?'dépense':'recette'}${cach>1?'s':''} masquée${cach>1?'s':''})</span></div>`;
    ul.innerHTML=html;on=0;mark();
    const a=ul.querySelector('#pkAll');if(a)a.onmousedown=e=>{e.preventDefault();e.stopPropagation();tout=true;draw();inp.focus()};
  }
  function mark(){ul.querySelectorAll('li[data-k]').forEach(li=>li.classList.toggle('on',+li.dataset.k===on));const el=ul.querySelector('li.on');if(el){const t=el.offsetTop,b=t+el.offsetHeight;if(t<ul.scrollTop)ul.scrollTop=t-4;else if(b>ul.scrollTop+ul.clientHeight)ul.scrollTop=b-ul.clientHeight+4}}
  function choose(k){if(k==null||k>=items.length)return;const v=items[k];closePick();onPick(v)}
  inp.oninput=draw;
  inp.onkeydown=e=>{if(e.key==='ArrowDown'){on=Math.min(items.length-1,on+1);mark();e.preventDefault()}else if(e.key==='ArrowUp'){on=Math.max(0,on-1);mark();e.preventDefault()}
    else if(e.key==='Enter'){e.preventDefault();choose(on)}else if(e.key==='Escape'){e.stopPropagation();closePick()}};
  ul.onmousedown=e=>{const li=e.target.closest('li[data-k]');if(li){e.preventDefault();choose(+li.dataset.k)}};
  draw();
  const ci=items.findIndex(x=>x&&norm(x)===norm(current));if(ci>=0){on=ci;mark()}
  setTimeout(()=>inp.focus(),0);
}

function suggestMotif(lib){
  let s=String(lib||'').toUpperCase().replace(/[:;|]/g,' ');
  s=s.replace(/^(PRLV|PRELEVEMENT|VIR|VIREMENT|PAIEMENT|CB|CARTE|FACTURE CARTE|ACHAT|RETRAIT|DIFFERE\+?)( SEPA| INST| EUROPEEN| PAR CARTE| CB)?\s+/g,'').replace(/^(PRLV|VIR|SEPA|CB|CARTE)\s+/g,'');
  const w=s.split(/\s+/).filter(t=>t&&!/\d{3,}/.test(t)&&!/^\d+[\/.,]\d+/.test(t)&&!/^[*X]{2,}/.test(t)&&t.length>1);
  return w.slice(0,3).join(' ').trim();
}

function totaux(annee,mois){ // recettes / dépenses classées
  let r=0,d=0;
  for(const o of D.ops){if(+o.date.slice(0,4)!==annee)continue;if(mois&&+o.date.slice(5,7)!==mois)continue;const ru=rubOf(o.rubrique);if(!ru||ru.type==='ignore')continue;if(ru.type==='recette')r+=o.montant;else d-=o.montant}
  return {r,d};
}

function topDep(y){
  const m=new Map();for(const o of D.ops){if(+o.date.slice(0,4)!==y)continue;const r=rubOf(o.rubrique);if(r?.type==='depense')m.set(r.nom,(m.get(r.nom)||0)-o.montant)}

let dblC=null,dblCV=-1;
function dblCarte(){ // opérations d'un compte suivi qui existent aussi sur une carte (même date, montant, libellé)
  if(dblC&&dblCV===dataVer)return dblC;
  const cle=o=>o.date+'|'+cents(o.montant)+'|'+norm(o.libelle).replace(/[^a-z0-9]/g,'').slice(0,12);
  const cartes=new Map();for(const o of D.ops){const c=compte(o.compte);if(c&&!c.suivi_solde){const k=cle(o);if(!cartes.has(k))cartes.set(k,[]);cartes.get(k).push(c.nom)}}
  dblC=new Map();if(cartes.size)for(const o of D.ops){const c=compte(o.compte);if(!c?.suivi_solde)continue;const l=cartes.get(cle(o));if(l&&l.length)dblC.set(o.id,l.shift())}
  dblCV=dataVer;return dblC;
}
function filtreOps(){
  const f=st.f,q=norm(f.q),qa=parseFloat(String(f.q).replace(',','.'));
  return D.ops.filter(o=>{
    if(f.compte&&o.compte!==f.compte)return false;
    if(f.annee&&o.date.slice(0,4)!==f.annee)return false;
    if(f.mois&&+o.date.slice(5,7)!==+f.mois)return false;
    if(f.rub==='__dblcarte'){if(!dblCarte().has(o.id))return false}else if(f.rub==='__classer'){if(!aClasser(o))return false}else if(f.rub&&norm(o.rubrique)!==norm(f.rub))return false;
    if(q&&!(norm(o.libelle).includes(q)||norm(o.rubrique).includes(q)||norm(o.note).includes(q)||(!isNaN(qa)&&Math.abs(Math.abs(o.montant)-Math.abs(qa))<0.005)))return false;
    return true;
  });
}

  const upd=k=>e=>{st.f[k]=e.target.value;st.lim=300;vOps()};

  if($('#bDelDbl'))$('#bDelDbl').onclick=async()=>{
    const ids=list.map(o=>o.id);if(!confirm(`Supprimer ces ${ids.length} opérations ?\n\nElles sont en double : elles restent sur la carte, la banque les prélève via « RELEVE CARTE ».`))return;
    try{for(let i=0;i<ids.length;i+=100)chk(await T('cpt_operations').delete().in('id',ids.slice(i,i+100)),'suppression')}catch(e){toast('Erreur : '+e.message);return}
    const set=new Set(ids);D.ops=D.ops.filter(o=>!set.has(o.id));index();st.f.rub='';vOps();toast(`${ids.length} doublon(s) supprimé(s)`)};

}
async function changeRub(o,rub,sel){
  try{chk(await T('cpt_operations').update({rubrique:rub}).eq('id',o.id),'classement')}catch(e){toast('Erreur : '+e.message);return}
  o.rubrique=rub;if(sel)sel.classList.toggle('vide',aClasser(o));index();
  if(!rub)return;
  const motif=suggestMotif(o.libelle);if(!motif)return;
  const m=norm(motif),autres=D.ops.filter(x=>x!==o&&aClasser(x)&&norm(x.libelle).includes(m));
  const deja=REG.some(r=>norm(o.libelle).includes(r.m)&&norm(rubOf(r.rubrique)?.nom||r.rubrique)===norm(rub));
  if(deja&&!autres.length)return;
  toast(`Classé en ${rub}.`+(autres.length?` ${autres.length} autre(s) « ${motif} » à classer.`:''),'Retenir « '+motif+' »',async()=>{
    await addRegle(motif,rub);
    if(autres.length){await bulkRub(autres,rub);toast(`${autres.length} autre(s) opération(s) classée(s)`)}
    if(st.view==='ops')vOps();
  });
}
async function addRegle(motif,rub){
  const ordre=Math.min(0,...D.regles.map(r=>r.ordre))-1;
  const {data}=chk(await T('cpt_regles').insert({motif,rubrique:rub,ordre}).select(),'règle');D.regles.push(data[0]);index();
}
async function bulkRub(ops,rub){
  for(let i=0;i<ops.length;i+=200){const part=ops.slice(i,i+200);chk(await T('cpt_operations').update({rubrique:rub}).in('id',part.map(o=>o.id)),'classement');part.forEach(o=>o.rubrique=rub)}
  index();
}
let docsCache=null;
async function openOp(o){
  const f=$('#opForm');f.reset();$('#opTitle').textContent=o?'Opération':'Nouvelle opération';
  $('#opCompte').innerHTML=D.comptes.map(c=>`<option value="${c.id}">${esc(c.nom)}</option>`).join('');
  $('#opRub').innerHTML=rubOptions(o?.rubrique||'');
  if(o){f.compte.value=o.compte;f.date.value=o.date;f.libelle.value=o.libelle;f.montant.value=o.montant;f.note.value=o.note||''}
  else{f.compte.value=st.f.compte||D.comptes[0]?.id||'';f.date.value=today()}
  $('#opDel').style.display=o?'':'none';$('#opForm').dataset.id=o?.id||'';
  $('#opDoc').innerHTML='<option value="">— aucun —</option>';$('#opDocLink').innerHTML='';
  show('#ovOp');
  try{
    if(!docsCache){const {data}=chk(await sb.from('docs').select('id,data').eq('supprime',false).range(0,9999),'docs');docsCache=data.map(r=>({id:r.id,...r.data}))}
    const docsD=docsCache.filter(d=>(d.dossier||'perso')===CUR);
    const mt=Math.abs(+f.montant.value||0),dt=f.date.value;

function periode(k){const n=new Date(),y=n.getFullYear(),m=n.getMonth();

let IMP=null;
function parseCSV(text){
  const first=text.split(/\r?\n/,1)[0],dl=[';',',','\t'].sort((a,b)=>first.split(b).length-first.split(a).length)[0];
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=c}
    else if(c==='"')q=true;else if(c===dl){row.push(cell);cell=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell=''}else cell+=c}
  if(cell||row.length){row.push(cell);rows.push(row)}
  return rows;
}
function pDate(v){
  if(v==null||v==='')return null;
  if(typeof v==='number'&&v>20000&&v<80000){const d=new Date(Math.round((v-25569)*864e5));return d.toISOString().slice(0,10)}
  if(v instanceof Date)return v.getFullYear()+'-'+String(v.getMonth()+1).padStart(2,'0')+'-'+String(v.getDate()).padStart(2,'0');
  const s=String(v).trim();let m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);
  if(m){let y=+m[3];if(y<100)y+=2000;return `${y}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`}
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);return m?m[0]:null;
}
function pNum(v){
  if(v==null||v==='')return null;if(typeof v==='number')return v;
  let s=String(v).replace(/[\s\u00a0\u202f€]/g,'').replace('−','-');
  if(/,\d{1,2}$/.test(s))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(/,/g,'');
  const n=parseFloat(s);return isNaN(n)?null:n;
}
function detecte(rows){
  for(let h=0;h<Math.min(rows.length,40);h++){
    const H=(rows[h]||[]).map(c=>norm(c));
    const find=(re,not)=>H.findIndex(c=>re.test(c)&&!(not&&not.test(c)));
    const iDate=[/^date (d.)?operation$/,/^date (de l.)?operation$/,/^date$/,/^date op/,/date de comptabilisation/,/^date/].map(r=>find(r,/valeur/)).find(i=>i>=0);
    const iLib=find(/libell|description|nature|operation$/,/date|type|simplifi/);
    const iDeb=find(/debit/),iCre=find(/credit/),iMt=find(/^montant|montant/);
    if(iDate==null||iDate<0||(iDeb<0&&iCre<0&&iMt<0))continue;
    const iSimp=find(/libelle simplifie/),iOper=find(/libelle operation/),iRef=find(/^reference/),iInfo=find(/informations complementaires/);
    if(iLib<0&&iSimp<0)continue;
    return {h,iDate,iDv:find(/valeur/),iLib,iDeb,iCre,iMt,iSolde:find(/^solde/),iSimp,iOper,iRef,iInfo,iType:find(/type operation/)};
  }
  return null;
}
async function lireFichier(file){
  let sheets=[];
  if(/\.(csv|txt)$/i.test(file.name)){
    const buf=await file.arrayBuffer();let text=new TextDecoder('utf-8').decode(buf);if(text.includes('\uFFFD'))text=new TextDecoder('windows-1252').decode(buf);
    sheets=[{nom:file.name,rows:parseCSV(text.replace(/^\uFEFF/,''))}];
  }else{
    await loadScript(LIB.xlsx);
    const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
    sheets=wb.SheetNames.map(n=>({nom:n,rows:XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null})}));
  }
  const res=[];
  for(const s of sheets){
    const d=detecte(s.rows);if(!d)continue;const lines=[];
    for(let r=d.h+1;r<s.rows.length;r++){
      const R=s.rows[r]||[],date=pDate(R[d.iDate]);if(!date)continue;
      let mt=d.iMt>=0&&(d.iDeb<0||d.iCre<0)?pNum(R[d.iMt]):null;
      if(mt==null){const db=pNum(R[d.iDeb]),cr=pNum(R[d.iCre]);if(db==null&&cr==null)continue;mt=(cr?Math.abs(cr):0)-(db?Math.abs(db):0)}
      let lib;
      if(d.iSimp>=0&&d.iOper>=0){lib=[R[d.iSimp],R[d.iOper],R[d.iRef],R[d.iInfo]].map(x=>x==null?'':String(x).trim()).join(':').replace(/:{2,}/g,':').replace(/:+$/,'')}
      else lib=String(R[d.iLib]??'').trim();
      lines.push({date,dv:d.iDv>=0?pDate(R[d.iDv]):null,lib:lib.replace(/\s+/g,' '),mt:Math.round(mt*100)/100,solde:d.iSolde>=0?pNum(R[d.iSolde]):null,type:d.iType>=0?norm(R[d.iType]):''});
    }
    if(lines.length)res.push({nom:s.nom,lines});
  }
  return res;
}

/* ---- historique des imports (regroupés par compte et heure d'enregistrement) ---- */
var LOT_GAP=120000,REPRISE_MS=600000;
function lotsImport(){
  const ops=D.ops.filter(o=>o.cree).slice().sort((a,b)=>a.cree<b.cree?-1:1),lots=[];
  for(const o of ops){const t=Date.parse(o.cree),l=lots.find(l=>l.compte===o.compte&&t-l.fin<LOT_GAP&&t>=l.debut);
    if(l){l.ops.push(o);l.fin=t}else lots.push({compte:o.compte,debut:t,fin:t,ops:[o]})}
  const t0=lots.reduce((m,l)=>Math.min(m,l.debut),Infinity);lots.forEach(l=>l.reprise=l.debut-t0<=REPRISE_MS);
  return lots.sort((a,b)=>b.fin-a.fin);
}

function verifUn(nom,lines){
  const L=lines.filter(l=>l.solde!=null);
  if(!lines.length)return {f:nom,err:'aucune opération'};
  if(!L.length)return {f:nom,err:'pas de colonne Solde dans ce fichier'};

/* =================== règles =================== */
let rgQ='',rgPb=false,MAJ=null,statCache=null,statVer=-1;
function regStats(){
  if(statCache&&statVer===dataVer)return statCache;
  const S=new Map(REG.map(r=>[r.id,{match:0,wins:0,ok:0,autre:0}])),seen=new Map();
  REG.forEach((r,i)=>{const s=S.get(r.id);
    if(seen.has(r.m)){s.doublon=seen.get(r.m);return}seen.set(r.m,r);
    for(let j=0;j<i;j++){const a=REG[j];if(a.m!==r.m&&r.m.includes(a.m)){s.couverte=a;break}}});
  for(const o of D.ops){const L=norm(o.libelle);let first=null;
    for(const r of REG){if(L.includes(r.m)){S.get(r.id).match++;if(!first)first=r}}
    if(first){const s=S.get(first.id);s.wins++;if(norm(o.rubrique)===norm(rubOf(first.rubrique)?.nom||first.rubrique))s.ok++;else if(!aClasser(o))s.autre++}}
  statCache=S;statVer=dataVer;return S;
}
const memeRub=(a,b)=>norm(rubOf(a)?.nom||a)===norm(rubOf(b)?.nom||b);
function coherence(r,s){
  if(!rubOf(r.rubrique))return ['b-err','Rubrique inconnue',true];
  if(s.doublon)return memeRub(s.doublon.rubrique,r.rubrique)?['b-grey','Doublon',true]:['b-warn',`Doublon en conflit (déjà → ${s.doublon.rubrique})`,true];
  if(s.couverte)return memeRub(s.couverte.rubrique,r.rubrique)?['b-grey',`Inutile : couverte par « ${s.couverte.motif} »`,true]:['b-warn',`Masquée par « ${s.couverte.motif} » → ${s.couverte.rubrique}`,true];
  if(!s.match)return ['b-grey','Jamais utilisée',true];
  if(!s.wins)return ['b-warn','Masquée par une autre règle',true];
  if(s.autre)return ['b-warn',`${s.autre} op. classée${s.autre>1?'s':''} autrement`,true];
  return ['b-ok','✓',false];
}
function vRegles(){
  if(MAJ)return vMaj();
  $('#tools').innerHTML=`<button class="btn" id="bClean">🧹 Nettoyer</button><button class="btn pri" id="bMaj">🔄 Mettre à jour les opérations</button>`;
  const S=regStats(),q=norm(rgQ),rang=new Map(REG.map((r,i)=>[r.id,i+1]));
  const all=REG.map(r=>({r,s:S.get(r.id),c:coherence(r,S.get(r.id))}));
  const nPb=all.filter(x=>x.c[2]).length,nDbl=all.filter(x=>x.s.doublon).length,nInut=all.filter(x=>x.s.couverte&&memeRub(x.s.couverte.rubrique,x.r.rubrique)).length;

  $('#view').innerHTML=`<div class="box"><form class="filters" id="rgF" style="margin:0"><b>Nouvelle règle :</b> le libellé contient <input class="f" name="motif" required placeholder="ex. METRO"> → <select class="f" name="rubrique" required>${rubOptions('',false)}</select><button class="btn pri">Ajouter</button></form>
   <p class="muted" style="font-size:13px;margin:8px 0 0">${REG.length} règles · ${nPb?`<b style="color:var(--warn)">${nPb} à revoir</b> (dont ${nDbl} doublon${nDbl>1?'s':''} et ${nInut} inutile${nInut>1?'s':''})`:'toutes cohérentes'}. La première règle qui correspond l'emporte : les plus hautes passent avant (⬆ pour remonter une règle).</p></div>

     <label style="display:flex;gap:6px;align-items:center;font-size:14px"><input type="checkbox" id="rgPb" ${rgPb?'checked':''}> Problèmes seulement</label><span class="muted" style="font-size:13px">${list.length} affichée(s)</span></div>
   <div class="tw" style="max-height:70vh"><table><thead><tr><th class="ln">N°</th><th>Le libellé contient</th><th>Rubrique</th><th class="num">Opérations</th><th>Cohérence</th><th></th></tr></thead><tbody>
   ${list.slice(0,600).map(({r,s,c})=>`<tr><td class="ln">${rang.get(r.id)}</td><td><input class="in" data-m="${r.id}" value="${esc(r.motif)}"></td><td><select class="in" data-r="${r.id}">${rubOptions(r.rubrique,false)}</select></td>
     <td class="num">${s.match?`<span class="clic" ${goA({q:r.motif})} title="Voir les opérations">${s.match}</span>`:'<span class="muted">0</span>'}</td>
     <td><span class="badge ${c[0]}">${esc(c[1])}</span></td>
     <td style="white-space:nowrap"><button class="ib" data-top="${r.id}" title="Remonter en premier">⬆</button><button class="ib" data-rdel="${r.id}" title="Supprimer">✕</button></td></tr>`).join('')}
   </tbody></table></div>${list.length>600?'<p class="muted">Affine la recherche pour voir les autres règles.</p>':''}`;
  let t;$('#rgQ').oninput=e=>{clearTimeout(t);t=setTimeout(()=>{rgQ=e.target.value;vRegles();const i=$('#rgQ');i.focus();i.setSelectionRange(i.value.length,i.value.length)},300)};
  $('#rgPb').onchange=e=>{rgPb=e.target.checked;vRegles()};
  $('#rgF').onsubmit=async e=>{e.preventDefault();try{await addRegle(e.target.motif.value.trim(),e.target.rubrique.value);toast('Règle ajoutée');vRegles()}catch(err){toast('Erreur : '+err.message)}};
  const upd=async(id,patch)=>{try{chk(await T('cpt_regles').update(patch).eq('id',id),'règle');Object.assign(D.regles.find(r=>r.id===id),patch);index();toast('Règle modifiée');vRegles()}catch(e){toast('Erreur : '+e.message)}};
  $('#view').querySelectorAll('[data-m]').forEach(i=>i.onchange=()=>i.value.trim()&&upd(i.dataset.m,{motif:i.value.trim()}));
  $('#view').querySelectorAll('[data-r]').forEach(i=>i.onchange=()=>upd(i.dataset.r,{rubrique:i.value}));
  $('#view').querySelectorAll('[data-top]').forEach(b=>b.onclick=()=>upd(b.dataset.top,{ordre:Math.min(0,...D.regles.map(r=>r.ordre))-1}));
  $('#view').querySelectorAll('[data-rdel]').forEach(b=>b.onclick=async()=>{try{await delRegles([b.dataset.rdel]);vRegles()}catch(e){toast('Erreur : '+e.message)}});

    const conflits=all.filter(x=>(x.s.doublon&&!memeRub(x.s.doublon.rubrique,x.r.rubrique))||(x.s.couverte&&!memeRub(x.s.couverte.rubrique,x.r.rubrique))).length;
    if(!ids.length){toast(conflits?`Rien à supprimer sans risque. ${conflits} règle(s) en conflit à régler à la main (filtre « Problèmes seulement »).`:'Rien à nettoyer : pas de doublon ni de règle inutile');return}

function vRubriques(){
  const use=new Map();for(const o of D.ops){const k=norm(o.rubrique);use.set(k,(use.get(k)||0)+1)}
  const col=(t,titre,aide)=>{const l=D.rubs.filter(r=>r.type===t);return `<div class="box"><h2>${titre}</h2><p class="muted" style="font-size:12.5px;margin-top:-6px">${aide}</p><ul>
    ${l.map((r,i)=>`<li><input value="${esc(r.nom)}" data-ren="${esc(r.nom)}"><span class="c">${use.get(norm(r.nom))||''}</span>
      <button class="ib" data-up="${esc(r.nom)}" ${i?'':'disabled'}>▲</button><button class="ib" data-down="${esc(r.nom)}" ${i<l.length-1?'':'disabled'}>▼</button>
      <select data-type="${esc(r.nom)}" class="ib" style="border:1px solid var(--line)"><option value="depense" ${t==='depense'?'selected':''}>Dép.</option><option value="recette" ${t==='recette'?'selected':''}>Rec.</option><option value="ignore" ${t==='ignore'?'selected':''}>Ign.</option></select>
      <button class="ib" data-rdel="${esc(r.nom)}">✕</button></li>`).join('')}</ul>
    <form class="filters" data-add="${t}" style="margin:10px 0 0"><input class="f" name="nom" placeholder="Nouvelle rubrique" required style="flex:1"><button class="btn sm">Ajouter</button></form></div>`};
  const inconnues=[...use].filter(([k])=>k&&!RUB.has(k));
  $('#view').innerHTML=`<div class="rubcols">${col('depense','Dépenses','Comptées en dépenses dans les récaps.')}${col('recette','Recettes','Comptées en recettes.')}${col('ignore','Ignorées','Virements internes (paiement du relevé carte…), non comptés.')}</div>
   ${inconnues.length?`<div class="box"><h2>Rubriques utilisées mais inconnues</h2><p class="muted" style="font-size:13px;margin-top:-6px">Ces opérations ne sont comptées nulle part. Fusionne-les dans une vraie rubrique.</p>
   ${inconnues.map(([k,n])=>{const nom=D.ops.find(o=>norm(o.rubrique)===k).rubrique;return `<div class="filters" style="margin:4px 0"><b style="min-width:180px">${esc(nom)}</b><span class="muted">${n} op.</span> → <select class="f" data-merge="${esc(nom)}">${rubOptions('',false)}</select></div>`}).join('')}</div>`:''}`;
  const v=$('#view');
  v.querySelectorAll('[data-ren]').forEach(i=>i.onchange=()=>renRub(i.dataset.ren,i.value.trim()));
  v.querySelectorAll('[data-type]').forEach(s=>s.onchange=async()=>{const r=rubOf(s.dataset.type);try{chk(await T('cpt_rubriques').update({type:s.value}).eq('nom',r.nom),'rubrique');r.type=s.value;index();vRubriques()}catch(e){toast('Erreur : '+e.message)}});
  const move=async(nom,d)=>{const r=rubOf(nom),l=D.rubs.filter(x=>x.type===r.type),i=l.indexOf(r),o=l[i+d];if(!o)return;
    const a=r.ordre===o.ordre?(d>0?r.ordre+1:r.ordre-1):o.ordre,b=r.ordre;
    try{chk(await T('cpt_rubriques').update({ordre:a}).eq('nom',r.nom),'ordre');chk(await T('cpt_rubriques').update({ordre:b}).eq('nom',o.nom),'ordre');r.ordre=a;o.ordre=b;index();vRubriques()}catch(e){toast('Erreur : '+e.message)}};
  v.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>move(b.dataset.up,-1));
  v.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>move(b.dataset.down,1));
  v.querySelectorAll('[data-add]').forEach(f=>f.onsubmit=async e=>{e.preventDefault();const nom=f.nom.value.trim();if(rubOf(nom))return toast('Cette rubrique existe déjà');
    const ordre=Math.max(0,...D.rubs.map(r=>r.ordre))+1;try{const {data}=chk(await T('cpt_rubriques').insert({nom,type:f.dataset.add,ordre}).select(),'rubrique');D.rubs.push(data[0]);index();vRubriques()}catch(err){toast('Erreur : '+err.message)}});
  v.querySelectorAll('[data-rdel]').forEach(b=>b.onclick=async()=>{const r=rubOf(b.dataset.rdel),n=use.get(norm(r.nom))||0;
    if(n&&!confirm(`${n} opération(s) utilisent « ${r.nom} ». Elles passeront « à classer ». Supprimer quand même ?`))return;
    if(!n&&!confirm(`Supprimer « ${r.nom} » ?`))return;
    try{chk(await T('cpt_rubriques').delete().eq('nom',r.nom),'suppression');D.rubs=D.rubs.filter(x=>x!==r);index();vRubriques()}catch(e){toast('Erreur : '+e.message)}});
  v.querySelectorAll('[data-merge]').forEach(s=>s.onchange=async()=>{const from=s.dataset.merge,to=s.value;if(!to)return;const ops=D.ops.filter(o=>o.rubrique===from);await bulkRub(ops,to);toast(`${ops.length} opération(s) passées en ${to}`);vRubriques()});
}
async function renRub(old,nu){
  if(!nu||nu===old)return;if(rubOf(nu)&&norm(nu)!==norm(old)){toast('Cette rubrique existe déjà');return vRubriques()}
  try{
    chk(await T('cpt_rubriques').update({nom:nu}).eq('nom',old),'renommage');
    const ops=D.ops.filter(o=>norm(o.rubrique)===norm(old));await bulkRub(ops,nu);
    const regs=D.regles.filter(r=>norm(r.rubrique)===norm(old));if(regs.length){chk(await T('cpt_regles').update({rubrique:nu}).in('id',regs.map(r=>r.id)),'règles');regs.forEach(r=>r.rubrique=nu)}
    rubOf(old).nom=nu;index();toast(`Rubrique renommée (${ops.length} opérations, ${regs.length} règles)`);
  }catch(e){toast('Erreur : '+e.message)}
  vRubriques();
}

/* =================== SCI : biens, loyers, quittances, 2072 =================== */
const tvaDef=()=>(dossier().infos||{}).tva===false?0:20;
const ttc=b=>Math.round(((+b.loyer_hc||0)+(+b.charges||0))*(1+(+b.tva||0)/100)*100)/100;
const ym=(y,m)=>`${y}-${String(m).padStart(2,'0')}`;
const finMois=(y,m)=>iso(new Date(y,m,0));
function actif(b,y,m){const a=ym(y,m)+'-01',z=finMois(y,m);return (!b.debut||b.debut<=z)&&(!b.fin||b.fin>=a)}
function recu(b,y,m){const k=ym(y,m),r=norm(b.rubrique);const ops=D.ops.filter(o=>o.montant>0&&norm(o.rubrique)===r&&o.date.slice(0,7)===k);return {s:Math.round(ops.reduce((t,o)=>t+o.montant,0)*100)/100,ops}}
const moisMax=y=>y<new Date().getFullYear()?12:y>new Date().getFullYear()?0:new Date().getMonth()+1;
// le mois en cours n'est contrôlé que 10 jours après l'échéance
const echu=(b,y,m)=>{const n=new Date();return !(y===n.getFullYear()&&m===n.getMonth()+1&&n.getDate()<=(+b.jour||1)+10)};
function detecteBiens(){
  const deja=new Set(D.biens.map(b=>norm(b.rubrique)));
  return D.rubs.filter(r=>r.type==='recette'&&!deja.has(norm(r.nom))).map(r=>{
    const cr=D.ops.filter(o=>o.montant>0&&norm(o.rubrique)===norm(r.nom)).slice(-8);if(cr.length<3)return null;
    const f=new Map();cr.forEach(o=>f.set(o.montant,(f.get(o.montant)||0)+1));const [mt,n]=[...f].sort((a,b)=>b[1]-a[1])[0];
    const last=cr[cr.length-1].libelle;let loc=last.includes(':')?last.split(':')[0]:last.replace(/^(VIR(EMENT)?( INST| SEPA| RECU)?|PRLV( SEPA)?)\s+/i,'');
    loc=loc.split(/\s+/).filter(w=>!/\d{3,}/.test(w)).slice(0,5).join(' ').trim();
    return {rub:r.nom,loc,mt,regulier:n>=3,ok:n>=3};
  }).filter(Boolean);
}
function vBiens(){
  const y=st.annee;$('#tools').innerHTML=yearSelect(y)+`<button class="btn pri" id="bAddB">+ Bien</button>`;$('#selAn').onchange=e=>{st.annee=+e.target.value;render()};
  const det=detecteBiens(),loc=D.biens.filter(b=>b.mode==='location'),mm=moisMax(y);
  const cell=(b,m)=>{if(!actif(b,y,m))return `<td class="num muted">—</td>`;const e=ttc(b),r=recu(b,y,m).s;
    if(m>mm||!echu(b,y,m))return `<td class="num muted" title="à venir">${r?eur0(r):''}</td>`;
    const c=r>=e-0.01?'b-ok':r>0?'b-warn':'b-err';
    return `<td class="num" ${goA({annee:String(y),mois:String(m),rub:b.rubrique})} style="cursor:pointer" title="attendu ${eur(e)} · reçu ${eur(r)}"><span class="badge ${c}">${r?eur0(r):'0'}</span></td>`};
  const bilan=b=>{let e=0,r=0;for(let m=1;m<=mm;m++)if(actif(b,y,m)&&echu(b,y,m)){e+=ttc(b);r+=recu(b,y,m).s}return {e,r,d:Math.round((e-r)*100)/100}};
  const alertes=[];loc.forEach(b=>{for(let m=1;m<=mm;m++)if(actif(b,y,m)&&echu(b,y,m)){const e=ttc(b),r=recu(b,y,m).s;if(e&&r<e-0.01)alertes.push(`<li><b>${esc(b.nom)}</b> (${esc(b.locataire||'')}) · ${MOIS[m-1].toLowerCase()} ${y} : ${r?`${eur(r)} reçus sur ${eur(e)}`:'rien reçu'}, <b class="neg">reste ${eur(e-r)}</b></li>`)}});
  const inp=(b,k,w,t='text')=>`<input class="in ${t==='number'?'num':''}" data-b="${b.id}" data-k="${k}" type="${t}" ${t==='number'?'step="0.01"':''} value="${esc(b[k]??'')}" style="width:${w}px">`;
  $('#view').innerHTML=`
  ${det.length?`<div class="box" style="border-color:#b9d3c6"><h2>Biens repérés dans tes opérations</h2><p class="muted" style="margin-top:-6px;font-size:13px">Ces rubriques de recettes reçoivent des versements réguliers. Coche celles qui sont des loyers pour créer les biens (tu complèteras ensuite adresses et montants).</p>
    ${det.map((d,i)=>`<label style="display:flex;gap:10px;align-items:center;padding:4px 0;font-size:14px"><input type="checkbox" data-det="${i}" ${d.ok?'checked':''}><b style="min-width:150px">${esc(d.rub)}</b><span class="muted">locataire probable :</span> ${esc(d.loc)} <span class="muted">· versement habituel</span> ${eur(d.mt)}</label>`).join('')}
    <button class="btn pri" id="bDet" style="margin-top:8px">Créer les biens cochés</button></div>`:''}
  ${alertes.length?`<div class="box" style="border-color:#efc9b3;background:var(--warn-soft)"><h2>⚠ Loyers impayés ou incomplets ${y}</h2><ul style="margin:0;padding-left:18px">${alertes.join('')}</ul></div>`:''}
  ${loc.length?`<div class="box"><h2>Suivi des loyers ${y} <span class="muted" style="font-weight:400;font-size:12.5px">(montants TTC reçus · vert = payé, orange = incomplet, rouge = rien reçu)</span></h2>
    <div class="tw" style="box-shadow:none"><table class="recap"><thead><tr><th>Bien</th>${MOISC.map(x=>`<th class="num">${x}</th>`).join('')}<th class="num">Attendu</th><th class="num">Reçu</th><th class="num">Reste dû</th></tr></thead><tbody>
    ${loc.map(b=>{const t=bilan(b);return `<tr><td><b>${esc(b.nom)}</b><div class="muted" style="font-size:11.5px">${esc(b.locataire||'')} · ${eur(ttc(b))}/mois</div></td>${MOISC.map((_,i)=>cell(b,i+1)).join('')}<td class="num">${eur0(t.e)}</td><td class="num">${eur0(t.r)}</td><td class="num ${t.d>0.01?'neg':'pos'}"><b>${eur(t.d)}</b></td></tr>`}).join('')}
    </tbody></table></div></div>`:''}
  <div class="box"><h2>Mes biens</h2>${D.biens.length?`<div class="tw" style="box-shadow:none"><table><thead><tr><th>Nom</th><th>Mode</th><th>Adresse du bien</th><th>Rubrique des loyers</th><th>Locataire</th><th>Adresse du locataire</th><th class="num">Loyer HT</th><th class="num">Charges HT</th><th class="num">TVA %</th><th class="num">TTC / mois</th><th class="num">Jour</th><th>Début bail</th><th>Fin</th><th></th></tr></thead><tbody>
    ${D.biens.map(b=>`<tr><td>${inp(b,'nom',130)}</td><td><select class="in" data-b="${b.id}" data-k="mode" style="min-width:125px"><option value="location" ${b.mode==='location'?'selected':''}>Location</option><option value="nue-propriete" ${b.mode!=='location'?'selected':''}>Nue-propriété</option></select></td>
      <td>${inp(b,'adresse',190)}</td><td><select class="in" data-b="${b.id}" data-k="rubrique"><option value="">—</option>${D.rubs.filter(r=>r.type==='recette').map(r=>`<option ${norm(r.nom)===norm(b.rubrique)?'selected':''}>${esc(r.nom)}</option>`).join('')}</select></td>
      <td>${inp(b,'locataire',160)}</td><td>${inp(b,'adresse_loc',190)}</td><td>${inp(b,'loyer_hc',85,'number')}</td><td>${inp(b,'charges',75,'number')}</td><td>${inp(b,'tva',50,'number')}</td>
      <td class="num"><b>${b.mode==='location'?eur(ttc(b)):''}</b></td><td>${inp(b,'jour',40,'number')}</td><td>${inp(b,'debut',125,'date')}</td><td>${inp(b,'fin',125,'date')}</td><td><button class="ib" data-bdel="${b.id}">✕</button></td></tr>`).join('')}
    </tbody></table></div>`:'<p class="muted">Aucun bien pour l\'instant.</p>'}
    <p class="muted" style="font-size:12.5px;margin:8px 0 0">« Nue-propriété » : bien sans loyer pour la SCI (ex. Broz Optique), non suivi dans les loyers. Les loyers reçus sont repérés grâce à la « rubrique des loyers ».</p></div>`;
  $('#bAddB').onclick=()=>saveBien({nom:'Nouveau bien',mode:'location',tva:tvaDef(),jour:1,ordre:D.biens.length});
  if($('#bDet'))$('#bDet').onclick=async()=>{const sel=det.filter((d,i)=>$(`[data-det="${i}"]`).checked);const tv=tvaDef();
    for(const [i,d] of sel.entries())await saveBien({nom:d.rub,mode:'location',rubrique:d.rub,locataire:d.loc,loyer_hc:Math.round(d.mt/(1+tv/100)*100)/100,charges:0,tva:tv,jour:1,ordre:D.biens.length+i},true);
    toast(sel.length+' bien(s) créé(s) : vérifie loyers, adresses et dates');vBiens()};
  $('#view').querySelectorAll('[data-b]').forEach(i=>i.onchange=async()=>{const b=D.biens.find(x=>x.id===i.dataset.b),k=i.dataset.k;
    let v=i.value.trim();if(['loyer_hc','charges','tva'].includes(k))v=pNum(v);if(k==='jour')v=parseInt(v)||1;if(['debut','fin'].includes(k))v=v||null;
    try{chk(await T('cpt_biens').update({[k]:v}).eq('id',b.id),'bien');b[k]=v;vBiens()}catch(e){toast('Erreur : '+e.message)}});
  $('#view').querySelectorAll('[data-bdel]').forEach(x=>x.onclick=async()=>{if(!confirm('Supprimer ce bien ? (les opérations ne sont pas touchées)'))return;
    try{chk(await T('cpt_biens').delete().eq('id',x.dataset.bdel),'bien');D.biens=D.biens.filter(b=>b.id!==x.dataset.bdel);vBiens()}catch(e){toast('Erreur : '+e.message)}});
}
async function saveBien(v,silent){try{const {data}=chk(await T('cpt_biens').insert(v).select(),'bien');D.biens.push(data[0]);if(!silent)vBiens()}catch(e){toast('Erreur : '+e.message)}}

let qB='',qY=new Date().getFullYear(),qM=new Set([new Date().getMonth()+1]);

  if(!loc.length){$('#view').innerHTML=`<div class="empty"><b>Aucun bien loué</b>Crée d'abord tes biens dans <a href="#" onclick="go('biens');return false">Biens & loyers</a>.</div>`;return}

    <div class="filters" style="margin:10px 0 0"><button class="btn sm" data-qs="paye">Tous les mois payés</button><button class="btn sm" data-qs="aucun">Aucun</button><button class="btn pri" id="qGo" style="margin-left:auto">🖨 Imprimer ${qM.size} document(s)</button></div>
    <p class="muted" style="font-size:12.5px;margin:10px 0 0">Mois entièrement payé → <b>quittance de loyer</b> · paiement incomplet → <b>reçu partiel</b> (une quittance ne peut pas être délivrée tant que tout n'est pas payé) · rien reçu → <b>avis d'échéance</b>. Pour un PDF : « Enregistrer au format PDF » dans la fenêtre d'impression.</p>
    ${manque.length?`<p style="margin:8px 0 0"><span class="badge b-warn">À compléter : ${manque.join(', ')}</span> dans <a href="#" onclick="go('reglages');return false">Réglages</a> / <a href="#" onclick="go('biens');return false">Biens</a></p>`:''}</div>`;
  $('#qB').onchange=e=>{qB=e.target.value;vQuittances()};$('#qY').onchange=e=>{qY=+e.target.value;vQuittances()};

  $('#view').querySelectorAll('[data-qs]').forEach(x=>x.onclick=()=>{qM=new Set(x.dataset.qs==='paye'?MOIS.map((_,i)=>i+1).filter(m=>actif(b,qY,m)&&recu(b,qY,m).s>=ttc(b)-0.01):[]);vQuittances()});
  $('#qGo').onclick=()=>{if(!qM.size)return toast('Coche au moins un mois');
    $('#printZone').innerHTML=`<div class="rel">${[...qM].sort((a,c)=>a-c).map(m=>quittanceHTML(b,qY,m)).join('')}</div>`;
    document.body.classList.add('printing');setTimeout(()=>{window.print();setTimeout(()=>document.body.classList.remove('printing'),500)},100)};
}
function quittanceHTML(b,y,m){
  const inf=dossier().infos||{},e=ttc(b),{s:r,ops}=recu(b,y,m),hc=+b.loyer_hc||0,ch=+b.charges||0,tv=+b.tva||0,tva=Math.round((hc+ch)*tv)/100;
  const type=r>=e-0.01?'QUITTANCE DE LOYER':r>0?'REÇU DE PAIEMENT PARTIEL':"AVIS D'ÉCHÉANCE";
  const per=`du 01/${String(m).padStart(2,'0')}/${y} au ${fdate(finMois(y,m))}`,e2=v=>eur(v).replace(/ | /g,' ');
  const dern=ops.length?ops[ops.length-1].date:null;
  return `<div class="sec" style="font-size:12.5px;line-height:1.55;max-width:680px;margin:0 auto">
    <div style="display:flex;justify-content:space-between;gap:20px;margin-bottom:26px"><div><b style="font-size:14px">${esc(inf.raison||dossier().nom)}</b><br>${esc(inf.siege||'')}${inf.siren?`<br>SIREN ${esc(inf.siren)}`:''}</div>
      <div style="text-align:right;min-width:230px"><b>${esc(b.locataire||'')}</b><br>${esc(b.adresse_loc||'').replace(/,\s*/g,'<br>')}</div></div>
    <h1 style="font-size:19px;text-align:center;margin:10px 0 4px">${type}</h1><p style="text-align:center;margin:0 0 20px">Période ${per}</p>
    <p><b>Local loué :</b> ${esc(b.nom)}${b.adresse?' · '+esc(b.adresse):''}</p>
    <table style="width:100%;border-collapse:collapse;margin:12px 0"><tbody>
      <tr><td>Loyer hors taxes</td><td class="n">${e2(hc)}</td></tr>
      ${ch?`<tr><td>Provision pour charges hors taxes</td><td class="n">${e2(ch)}</td></tr>`:''}
      ${tv?`<tr><td>TVA ${String(tv).replace('.',',')} %</td><td class="n">${e2(tva)}</td></tr>`:''}
      <tr class="s"><td>Total ${tv?'TTC ':''}dû pour la période</td><td class="n">${e2(e)}</td></tr>
      ${r?`<tr><td>Montant reçu${dern?' (dernier versement le '+fdate(dern)+')':''}</td><td class="n">${e2(r)}</td></tr>`:''}
      ${r<e-0.01?`<tr class="s"><td>Reste dû</td><td class="n">${e2(e-r)}</td></tr>`:''}
    </tbody></table>
    ${type==='QUITTANCE DE LOYER'?`<p>Je soussigné(e) ${esc(inf.gerant||'……………')}, agissant pour le compte de ${esc(inf.raison||dossier().nom)}, bailleur, reconnais avoir reçu de ${esc(b.locataire||'……')} la somme de <b>${e2(r)}</b> au titre du loyer et des charges de la période ${per}, et lui en donne quittance, sous réserve de tous mes droits.</p>`
      :type.startsWith('REÇU')?`<p>Reçu de ${esc(b.locataire||'……')} la somme de <b>${e2(r)}</b> à valoir sur le loyer et les charges de la période ${per}. Ce reçu ne vaut pas quittance : il reste dû <b>${e2(e-r)}</b>.</p>`
      :`<p>Nous vous remercions de bien vouloir régler la somme de <b>${e2(e)}</b> au titre du loyer et des charges de la période ${per}${b.jour?`, payable le ${b.jour} ${MOIS[m-1].toLowerCase()} ${y}`:''}.</p>`}

/* déclaration 2072 */
const C2072=[
 ['loyers','Loyers bruts encaissés (hors TVA)','r'],['recdiv','Recettes diverses (remboursements, indemnités…)','r'],
 ['admin',"Frais d'administration et de gestion (comptable, frais bancaires…)",'c'],['assur',"Primes d'assurance",'c'],
 ['travaux',"Travaux de réparation, d'entretien et d'amélioration",'c'],['impots','Impositions (taxe foncière…)','c'],
 ['copro','Provisions pour charges de copropriété','c'],['emprunt',"Échéances d'emprunt (seuls les intérêts comptent, saisis ci-dessous)",'x'],['exclu','Non concerné (TVA, placements, virements…)','x']];
function cat2072(r){
  if(r.ligne2072)return r.ligne2072;const n=norm(r.nom);
  if(D.biens.some(b=>norm(b.rubrique)===n))return 'loyers';
  if(/pret|emprunt/.test(n))return 'emprunt';if(/tva|placement|cpt|virement|caution|^cc\d|compte courant/.test(n))return 'exclu';
  if(/assur/.test(n))return 'assur';if(/foncier|impot|cfe/.test(n))return 'impots';if(/copro/.test(n))return 'copro';
  if(/travaux|jardin|entretien|reparation|maison/.test(n))return 'travaux';if(/comptab|frais|honorai|gestion|banc|financ/.test(n))return 'admin';
  return r.type==='recette'?'recdiv':'exclu';
}
function vD2072(){
  const y=st.annee;$('#tools').innerHTML=yearSelect(y)+`<button class="btn" onclick="print()">🖨 Imprimer</button>`;$('#selAn').onchange=e=>{st.annee=+e.target.value;render()};
  const tvaOf=rub=>{const b=D.biens.find(x=>norm(x.rubrique)===norm(rub));return b?+b.tva||0:tvaDef()};
  const tot={},det={};C2072.forEach(([k])=>{tot[k]=0;det[k]=[]});
  for(const r of D.rubs){const k=cat2072(r);if(r.type==='ignore')continue;
    const ops=D.ops.filter(o=>+o.date.slice(0,4)===y&&norm(o.rubrique)===norm(r.nom));if(!ops.length)continue;
    let v=ops.reduce((s,o)=>s+o.montant,0);if(C2072.find(c=>c[0]===k)[2]==='c'||k==='emprunt')v=-v;
    if(k==='loyers')v=v/(1+tvaOf(r.nom)/100);
    tot[k]+=v;det[k].push([r.nom,v])}
  const nLoc=D.biens.filter(b=>b.mode==='location'&&MOIS.some((_,i)=>actif(b,y,i+1))).length,forfait=20*nLoc;
  const empr=D.rubs.filter(r=>cat2072(r)==='emprunt'),ann=k=>D.annexes.find(a=>a.annee===y&&a.cle===k)?.valeur;
  const inter=empr.reduce((s,r)=>s+(+ann('interets:'+r.nom)||0),0);
  const rec=tot.loyers+tot.recdiv,chg=tot.admin+tot.assur+tot.travaux+tot.impots+tot.copro+forfait+inter,net=rec-chg;
  const row=(lab,v,k,b)=>`<tr${b?' class="tot"':''}><td>${lab}${k&&det[k].length?`<div class="muted" style="font-size:11.5px">${det[k].map(([n,x])=>`<span class="clic" ${goA({annee:String(y),rub:n})}>${esc(n)} ${eur0(x)}</span>`).join(' · ')}</div>`:''}</td><td class="num">${eur(v)}</td></tr>`;
  $('#view').innerHTML=`<p class="muted" style="margin-top:0;font-size:13px">Aide à la préparation de la <b>déclaration 2072-S</b> (revenus fonciers ${y} de la SCI), calculée à partir de tes opérations classées. À vérifier avec ton comptable avant dépôt. ${tvaDef()?'La SCI étant à la TVA, les loyers sont repris hors taxes ; si la SCI récupère la TVA sur ses dépenses, les charges doivent aussi être déclarées hors taxes.':''}</p>
  <div class="grid2"><div class="box"><h2>Résultat foncier ${y}</h2><div class="tw" style="box-shadow:none"><table class="recap"><tbody>
    <tr class="sec"><td colspan="2">Recettes</td></tr>${row('Loyers bruts encaissés (hors TVA)',tot.loyers,'loyers')}${row('Recettes diverses',tot.recdiv,'recdiv')}${row('Total des recettes',rec,null,1)}
    <tr class="sec"><td colspan="2">Frais et charges</td></tr>${row("Frais d'administration et de gestion",tot.admin,'admin')}${row(`Frais de gestion forfaitaires (20 € × ${nLoc} ${nLoc>1?'locaux':'local'})`,forfait)}${row("Primes d'assurance",tot.assur,'assur')}
    ${row("Travaux de réparation, d'entretien et d'amélioration",tot.travaux,'travaux')}${row('Impositions',tot.impots,'impots')}${row('Provisions pour charges de copropriété',tot.copro,'copro')}${row("Intérêts d'emprunt",inter)}
    ${row('Total des frais et charges',chg,null,1)}
    <tr class="tot"><td>${net>=0?'Bénéfice foncier':'Déficit foncier'}</td><td class="num ${net<0?'neg':'pos'}">${eur(net)}</td></tr></tbody></table></div></div>
  <div class="box"><h2>Intérêts d'emprunt ${y}</h2><p class="muted" style="font-size:12.5px;margin-top:-6px">Seuls les intérêts sont déductibles. Reporte le total des intérêts de l'année indiqué sur l'attestation annuelle ou le tableau d'amortissement de chaque prêt.</p>
    ${empr.length?empr.map(r=>{const paye=-D.ops.filter(o=>+o.date.slice(0,4)===y&&norm(o.rubrique)===norm(r.nom)).reduce((s,o)=>s+o.montant,0);
      return `<div class="filters" style="margin:6px 0"><b style="min-width:110px">${esc(r.nom)}</b><span class="muted" style="font-size:13px">échéances payées ${eur(paye)} · dont intérêts :</span><input class="f" data-int="${esc(r.nom)}" value="${ann('interets:'+r.nom)??''}" placeholder="0,00" style="width:110px" inputmode="decimal"> €</div>`}).join(''):'<p class="muted">Aucune rubrique d\'emprunt repérée (classe tes rubriques ci-dessous).</p>'}
    <h2 style="margin-top:18px">Classement des rubriques</h2><p class="muted" style="font-size:12.5px;margin-top:-6px">Chaque rubrique est rangée dans une ligne de la déclaration. Corrige si besoin, c'est mémorisé.</p>
    <div class="tw" style="box-shadow:none;max-height:420px"><table><tbody>${D.rubs.filter(r=>r.type!=='ignore').map(r=>`<tr><td>${esc(r.nom)}${r.ligne2072?'':' <span class="muted" style="font-size:11px">(proposé)</span>'}</td><td><select class="in" data-l2="${esc(r.nom)}">${C2072.map(([k,l])=>`<option value="${k}" ${cat2072(r)===k?'selected':''}>${l}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div></div></div>`;
  $('#view').querySelectorAll('[data-int]').forEach(i=>i.onchange=async()=>{const cle='interets:'+i.dataset.int,v=pNum(i.value);
    try{chk(await T('cpt_annexes').upsert({annee:y,cle,valeur:v},{onConflict:'user_id,dossier,annee,cle'}),'intérêts');const a=D.annexes.find(a=>a.annee===y&&a.cle===cle);if(a)a.valeur=v;else D.annexes.push({annee:y,cle,valeur:v});vD2072()}catch(e){toast('Erreur : '+e.message)}});
  $('#view').querySelectorAll('[data-l2]').forEach(s=>s.onchange=async()=>{const r=rubOf(s.dataset.l2);try{chk(await T('cpt_rubriques').update({ligne2072:s.value}).eq('nom',r.nom),'2072');r.ligne2072=s.value;vD2072()}catch(e){toast('Erreur : '+e.message)}});
}

const ALIAS={'golf':'SORTIES / LOISIRS / GOLF','sorties / loisirs':'SORTIES / LOISIRS / GOLF','placement':'PLACEMENTS','res':'RESTAURANT','restaurant gg':'RESTAURANT','cadeau coco':'CADEAU'};
async function importGGI(file){
  const msg=t=>$('#xMsg').innerHTML=t,pr=$('#xProg');pr.style.display='';const bar=p=>pr.querySelector('i').style.width=Math.round(p*100)+'%';
  try{
    msg('Lecture du classeur…');bar(.02);await loadScript(LIB.xlsx);
    const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
    const S=n=>wb.Sheets[n]?XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null}):null;
    const alias=$('#xAlias').checked;
    // rubriques
    const R=S('RUBRIQUE');if(!R)throw new Error('feuille RUBRIQUE introuvable : est-ce bien ton classeur GGI ?');
    const rubs=[],seen=new Set();let ordre=0;
    const addR=(n,t)=>{n=String(n??'').trim();if(!n||seen.has(norm(n)))return;seen.add(norm(n));rubs.push({nom:n,type:t,ordre:ordre++})};
    R.forEach(r=>addR(r[0],'recette'));R.forEach(r=>addR(r[1],'depense'));addR('.','ignore');addR(',','ignore');
    const canon=n=>{const s=String(n??'').trim();const k=norm(s);if(seen.has(k))return rubs.find(r=>norm(r.nom)===k).nom;if(alias&&ALIAS[k])return ALIAS[k];return s};
    // comptes
    const B=S('BANQUE')||[],comptes=[];
    B.forEach((r,i)=>{const id=String(r[1]??'').trim();if(/^CPT\d+$/i.test(id)&&S(id))comptes.push({id:id.toUpperCase(),nom:String(r[2]??id).trim(),banque:String(r[10]??r[2]??'').trim(),suivi_solde:r[9]===true||String(r[9]).toUpperCase()==='TRUE',ordre:i+1,solde_initial:0})});
    // opérations
    const ops=[];
    for(const c of comptes){const rows=S(c.id);let h=rows.slice(0,4).findIndex(r=>norm(r?.[0])==='date');if(h<0)h=1;const f2=rows[h]?.[5];c.solde_initial=typeof f2==='number'?Math.round(f2*100)/100:0;
      for(let i=h+1;i<rows.length;i++){const r=rows[i];const date=pDate(r[0]);if(!date)continue;const db=pNum(r[3]),cr=pNum(r[4]);if(db==null&&cr==null)continue;
        const mt=Math.round(((cr||0)+(db||0))*100)/100;ops.push({compte:c.id,date,date_valeur:pDate(r[1]),libelle:String(r[2]??'').trim(),montant:mt,rubrique:canon(r[6])})}}
    // règles
    const BD=S('BDD')||[],regles=[];let hb=BD.slice(0,4).findIndex(r=>norm(r?.[0])==='libelle');if(hb<0)hb=1;BD.slice(hb+1).forEach((r,i)=>{const m=String(r[0]??'').trim();if(m&&r[1]!=null&&String(r[1]).trim())regles.push({motif:m,rubrique:canon(r[1]),ordre:i})});
    // épargne
    const E=S('EPARGNE')||[],ep=[];let an=null,o2=0;
    for(const r of E){if(typeof r[0]==='number'&&r[0]>1990&&r[0]<2100){an=r[0];o2=0;continue}
      const s=String(r[0]??'').trim();if(!an||!s||/^total/i.test(s))continue;
      let nom=s,k=2;while(ep.some(e=>e.annee===an&&e.support===nom&&e.ordre!==o2))nom=s+' ('+(k++)+')';
      for(let m=1;m<=12;m++){const v=pNum(r[m]);if(v!=null)ep.push({annee:an,support:nom,mois:m,montant:v,ordre:o2})}o2++}
    const epU=[...new Map(ep.map(e=>[e.annee+'|'+e.support+'|'+e.mois,e])).values()];
    // chèques
    const chq=[];wb.SheetNames.filter(n=>/^CHEQUE\d+$/i.test(n)).forEach(n=>{const cpt='CPT'+n.match(/\d+/)[0];(S(n)||[]).slice(2).forEach(r=>{if(r[1]==null||r[1]==='')return;chq.push({compte:cpt,numero:String(r[1]).trim(),date:pDate(r[0]),beneficiaire:String(r[2]??'').trim(),montant:pNum(r[3]),rubrique:canon(r[4])})})});
    msg(`Trouvé : ${comptes.length} comptes, ${ops.length} opérations, ${rubs.length} rubriques, ${regles.length} règles, ${epU.length} valeurs d'épargne, ${chq.length} chèques. Envoi dans le cloud…`);bar(.05);
    if($('#xRepl').checked){for(const t of ['cpt_operations','cpt_regles','cpt_epargne','cpt_cheques','cpt_rubriques','cpt_comptes'])chk(await T(t).delete().eq('user_id',sbUser.id),'effacement '+t)}
    chk(await T('cpt_comptes').upsert(comptes,{onConflict:SANS_DOSSIER?'user_id,id':'user_id,dossier,id'}),'comptes');bar(.08);
    chk(await T('cpt_rubriques').upsert(rubs,{onConflict:SANS_DOSSIER?'user_id,nom':'user_id,dossier,nom'}),'rubriques');bar(.1);
    await insertBatch('cpt_regles',regles,(a,b)=>bar(.1+.1*a/b));
    for(let i=0;i<epU.length;i+=500)chk(await T('cpt_epargne').upsert(epU.slice(i,i+500),{onConflict:SANS_DOSSIER?'user_id,annee,support,mois':'user_id,dossier,annee,support,mois'}),'épargne');bar(.22);
    if(chq.length)await insertBatch('cpt_cheques',chq);
    await insertBatch('cpt_operations',ops,(a,b)=>{bar(.25+.73*a/b);msg(`Envoi des opérations : ${a} / ${b}…`)});
    msg('Rechargement…');await loadAll();vReglages();
    const nC=D.ops.filter(aClasser).length;
    $('#xProg').style.display='none';msg(`✅ Classeur repris : ${D.comptes.length} comptes, ${D.ops.length} opérations, ${D.regles.length} règles, ${D.rubs.length} rubriques.${nC?` <a href="#" ${goA({rub:'__classer'})}>${nC} opération(s) à classer</a>.`:''}`);
    toast('Classeur Excel repris');
  }catch(e){msg('❌ '+esc(e.message)+(e.etape?' ('+esc(e.etape)+')':''));}
}
function exportXlsx(aoa,sheet,name){loadScript(LIB.xlsx).then(()=>{const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(aoa),sheet.slice(0,31));XLSX.writeFile(wb,name+'-'+today()+'.xlsx')})}
async function exportTout(){
  await loadScript(LIB.xlsx);const wb=XLSX.utils.book_new(),add=(n,a)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(a),n);
  add('Comptes',[['Code','Nom','Banque','Solde de départ','Suivi solde','Solde actuel'],...D.comptes.map(c=>[c.id,c.nom,c.banque,+c.solde_initial,c.suivi_solde?'oui':'non',c.suivi_solde?soldeActuel(c.id):''])]);
  for(const c of D.comptes)add(c.id,[['Date','Date valeur','Libellé','Montant','Rubrique','Note'],...D.ops.filter(o=>o.compte===c.id).map(o=>[o.date,o.date_valeur||'',o.libelle,o.montant,o.rubrique,o.note||''])]);
  add('Rubriques',[['Rubrique','Type','Budget'],...D.rubs.map(r=>[r.nom,r.type,r.budget??''])]);
  add('Regles',[['Motif','Rubrique'],...REG.map(r=>[r.motif,r.rubrique])]);
  add('Epargne',[['Année','Support','Mois','Montant'],...D.epargne.map(e=>[e.annee,e.support,e.mois,e.montant])]);
  add('Cheques',[['Compte','N°','Date','Bénéficiaire','Montant','Rubrique'],...D.cheques.map(c=>[c.compte,c.numero,c.date,c.beneficiaire,c.montant,c.rubrique])]);
  XLSX.writeFile(wb,'mes-comptes-sauvegarde-'+today()+'.xlsx');
}

/* =================== garder la position après une modification =================== */
function garderPosition(fn){return function(...a){
  const v=$('#view'),cle=st.view+(MAJ?'-maj':''),meme=v.dataset.v===cle;
  const tw=v.querySelector('.tw'),t=tw?tw.scrollTop:0,y=window.scrollY;
  fn.apply(this,a);v.dataset.v=cle;
  if(meme){const n=v.querySelector('.tw');if(n)n.scrollTop=t;window.scrollTo(0,y)}
}}
vRegles=garderPosition(vRegles);vMaj=garderPosition(vMaj);vOps=garderPosition(vOps);vRubriques=garderPosition(vRubriques);
vCheques=garderPosition(vCheques);vBiens=garderPosition(vBiens);vQuittances=garderPosition(vQuittances);vD2072=garderPosition(vD2072);vEpargne=garderPosition(vEpargne);vReglages=garderPosition(vReglages);vAnnuel=garderPosition(vAnnuel);

/* =================== démarrage =================== */
async function start(){
  $('#who').textContent=sbUser?.email||'';$('#bLock').style.display=pinSet()?'':'none';
  $('#view').innerHTML='<div class="empty">Chargement de tes comptes…</div>';
  try{await loadDossiers();majDossierUI();await loadAll()}catch(e){$('#view').innerHTML=`<div class="empty"><b>Impossible de charger tes comptes</b>${esc(e.message)}${/relation|does not exist|schema cache/i.test(e.message)?'<br><br>As-tu bien exécuté le script <b>2-creer-les-comptes.sql</b> dans Supabase ?':''}</div>`;return}
  render();
}
(async()=>{
  if(pinSet()&&!(await resumeSession()))await openLock('unlock');
  try{await sbClient()}catch(e){$('#view').innerHTML=`<div class="empty"><b>Pas de connexion internet</b>${esc(e.message)}</div>`;return}
  if(!sbUser){render();return}
  if(CRYPTO_OK&&!pinSet())await openLock('set');
  await start();
})();
